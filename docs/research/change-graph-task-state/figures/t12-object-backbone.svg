<svg xmlns="http://www.w3.org/2000/svg" width="780" height="830" viewBox="0 0 780 830"><rect width="780" height="830" fill="#f7faff"/>
<text x="32" y="49" font-family="Microsoft YaHei,sans-serif" font-size="25" fill="#18344d">对象怎样连接工作方向与实际变化</text>
<text x="32" y="82" font-family="Microsoft YaHei,sans-serif" font-size="16" fill="#18344d">对象身份为研究索引；状态内容分别引用来源。</text>
<rect x="225" y="110" width="330" height="80" rx="12" fill="#e8f1fc" stroke="#356b9d" stroke-width="2"/>
<text x="239" y="141" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">目标 / 要求</text>
<text x="239" y="168" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">保留范围与验收要求</text>
<polyline points="390,190 390,230" fill="none" stroke="#356b9d" stroke-width="3"/>
<polygon points="390,230 384,220 396,220" fill="#356b9d"/>
<rect x="225" y="230" width="330" height="80" rx="12" fill="#ffffff" stroke="#356b9d" stroke-width="2"/>
<text x="239" y="261" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">计划 @ 版本</text>
<text x="239" y="288" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">安排、依赖、部分替代与保留</text>
<polyline points="390,310 390,350" fill="none" stroke="#356b9d" stroke-width="3"/>
<polygon points="390,350 384,340 396,340" fill="#356b9d"/>
<rect x="225" y="350" width="330" height="80" rx="12" fill="#ffffff" stroke="#356b9d" stroke-width="2"/>
<text x="239" y="381" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">工作尝试</text>
<text x="239" y="408" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">按当时计划推进；可独立结束</text>
<polyline points="390,430 390,470" fill="none" stroke="#356b9d" stroke-width="3"/>
<polygon points="390,470 384,460 396,460" fill="#356b9d"/>
<rect x="225" y="470" width="330" height="80" rx="12" fill="#ffffff" stroke="#356b9d" stroke-width="2"/>
<text x="239" y="501" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">成果 @ 版本</text>
<text x="239" y="528" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">实现、提交与验收分别记录</text>
<polyline points="390,550 390,590" fill="none" stroke="#356b9d" stroke-width="3"/>
<polygon points="390,590 384,580 396,580" fill="#356b9d"/>
<rect x="225" y="590" width="330" height="80" rx="12" fill="#ffffff" stroke="#356b9d" stroke-width="2"/>
<text x="239" y="621" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">依据 / 报告</text>
<text x="239" y="648" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">检查对象、范围、结果与报告者</text>
<rect x="32" y="710" width="716" height="80" rx="12" fill="#e8f1fc" stroke="#356b9d" stroke-width="2"/>
<text x="46" y="741" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">Change 保存每一步的前后状态、理由与来源。</text>
<text x="46" y="768" font-family="Microsoft YaHei,sans-serif" font-size="18" fill="#18344d">责任归属分别比较父表、独立关系、子项；其他条件保持一致。</text>
</svg>